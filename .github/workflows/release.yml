# Uma tag vX.Y.Z vira uma release com o instalador ClawdeskSetup.exe e o SHA-256 dele, que a
# atualização automática do app confere antes de instalar.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir a versão
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne $env:GITHUB_REF_NAME) { Write-Error "A tag $env:GITHUB_REF_NAME nao bate com o VERSION ($v)."; exit 1 }

      - name: Compilar o app e o instalador
        shell: powershell
        run: ./desktop/build.ps1 -Out dist -Setup

      - name: Calcular o SHA-256
        shell: powershell
        run: |
          $h = (Get-FileHash dist/ClawdeskSetup.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/ClawdeskSetup.exe.sha256", "$h  ClawdeskSetup.exe`n")
          Write-Output "SHA-256: $h"

      - name: Publicar a release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # O gh escreve em stderr quando a release não existe; isso não pode derrubar o passo.
          $ErrorActionPreference = 'Continue'
          # Se alguém já criou a release pelo navegador, só anexa os arquivos a ela.
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/ClawdeskSetup.exe dist/ClawdeskSetup.exe.sha256 --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/ClawdeskSetup.exe dist/ClawdeskSetup.exe.sha256 --title "Clawdesk $env:GITHUB_REF_NAME" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
